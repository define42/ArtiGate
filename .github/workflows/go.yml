name: Go

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - "v*"          # prevent infinite loops when pushing tags
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build & test
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secure Compose defaults
        shell: bash
        run: |
          if env -u ARTIGATE_LOW_AUTH -u ARTIGATE_DIODE_TOKEN docker compose config >/dev/null 2>&1; then
            echo "docker compose config unexpectedly accepted missing credentials" >&2
            exit 1
          fi
          # shellcheck disable=SC2016 # The password hash contains literal dollar signs.
          export ARTIGATE_LOW_AUTH='ci:$argon2id$v=19$m=8,t=1,p=1$c2FsdA$aGFzaA'
          export ARTIGATE_DIODE_TOKEN='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          docker compose config --format json > compose-rendered.json
          python3 - <<'PY'
          import json

          with open("compose-rendered.json", encoding="utf-8") as f:
              config = json.load(f)
          services = config["services"]
          assert services["low"]["ports"][0]["host_ip"] == "127.0.0.1"
          assert services["high"]["ports"][0]["host_ip"] == "127.0.0.1"
          assert services["low"]["environment"]["ARTIGATE_LOW_AUTH"]
          assert services["low"]["environment"]["ARTIGATE_DIODE_TOKEN"]
          assert services["high"]["environment"]["ARTIGATE_DIODE_TOKEN"]
          low_sources = {v["source"] for v in services["low"]["volumes"]}
          high_sources = {v["source"] for v in services["high"]["volumes"]}
          assert "keys" in low_sources
          assert "keys" not in high_sources
          assert "high-keys" in high_sources
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test dashboard behavior
        run: make ui-test

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run unit tests with coverage
        run: gotestsum --junitfile junit.xml -- ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Test SFTP transport
        run: go test -race -tags=integration ./cmd/artigate -run SFTP

      - name: Show coverage in job summary
        if: ${{ !cancelled() }}
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "## Go Test Coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml

  # ---------------------------------------------------------------------------
  # Lint (uses the repository's .golangci.yml)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        env:
          GOTOOLCHAIN: local
        with:
          version: v2.13.2
          install-mode: goinstall

  # ---------------------------------------------------------------------------
  # Required end-to-end gate (same commit as the calling workflow)
  # ---------------------------------------------------------------------------
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets:
      ARTIGATE_HF_TOKEN: ${{ secrets.ARTIGATE_HF_TOKEN }}

  # ---------------------------------------------------------------------------
  # Versioning, release & container publish (push to main only)
  # ---------------------------------------------------------------------------
  release:
    needs: [test, lint, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Hold this lock from version calculation through publication. A newer
    # successful run must never calculate the same version concurrently.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write   # required for tags + GitHub releases
      packages: write   # required for GHCR push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release is still current
        id: current
        run: |
          # A slower older run can reach this serialized job after a newer
          # commit. It must not replace latest with an older image.
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current"
          echo "publish=$([ "$current" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Calculate next version without creating a tag
        if: steps.current.outputs.publish == 'true'
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          dry_run: true

      - name: Compute image identity
        if: steps.current.outputs.publish == 'true'
        id: image
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="$NEW_TAG"
          if [ -z "$version" ]; then
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build release image locally
        if: steps.current.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: artigate-release-test:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}

      - name: Verify stamped image and both server roles
        if: steps.current.outputs.publish == 'true'
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: bash .github/scripts/check-release-image.sh "$IMAGE_ID" "$EXPECTED_VERSION"

      - name: Login to GHCR
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image without rebuilding
        if: steps.current.outputs.publish == 'true'
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          tags=("$GITHUB_SHA")
          if [ -n "$NEW_TAG" ]; then
            tags+=("$NEW_TAG")
          fi
          tags+=(latest)
          for tag in "${tags[@]}"; do
            docker tag "$IMAGE_ID" "$IMAGE_REPOSITORY:$tag"
            docker push "$IMAGE_REPOSITORY:$tag"
          done

      - name: Create tag and GitHub release after image verification and publication
        if: steps.current.outputs.publish == 'true' && steps.tag.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          commit: ${{ github.sha }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
