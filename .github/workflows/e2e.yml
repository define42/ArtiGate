name: E2E

# Full end-to-end run: builds the real binary, starts a low+high pair wired
# over the HTTP diode transport, collects every stream from its real
# upstream (PyPI, proxy.golang.org, Maven Central, npmjs, cli.github.com,
# Docker Hub, huggingface.co, conda.anaconda.org, rubygems.org,
# repo.packagist.org, open-vsx.org, galaxy.ansible.com, cloud.r-project.org,
# github.com), and validates with the real client tools (pip, go, mvn+java,
# npm+node, apt-get+dpkg, dnf+rpm, docker, huggingface_hub, curl, ollama,
# micromamba, bundler, composer+php, ansible-galaxy, Rscript, git, oras,
# cosign, codium, snap). Receiver clients have no upstream network access.
# OCI artifacts use a local registry and temporary signing keys. See
# e2e/doc.go.

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Pinned rather than ubuntu-latest: the suite leans on image-provided
    # toolchains (python, node, maven, docker) and apt-installed dnf, whose
    # behavior shifts between images — bump deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install client tools and receiver isolation dependencies
        run: |
          sudo apt-get update
          # ruby-bundler: the runner image ships ruby but no bundler binary.
          sudo apt-get install -y --no-install-recommends \
            dnf rpm r-base-core ruby-bundler util-linux iproute2 zstd \
            qemu-system-x86 qemu-utils xorriso \
            libnss3 libatk-bridge2.0-0 libxkbcommon0 libgbm1 libasound2t64
          if command -v pipx >/dev/null 2>&1; then
            pipx install huggingface_hub
            pipx install ansible-core
          else
            python3 -m pip install --user --break-system-packages huggingface_hub ansible-core
          fi
          # The ubuntu-24.04 image dropped the HashiCorp tools; install a
          # pinned terraform when neither it nor tofu is present.
          if ! command -v terraform >/dev/null 2>&1 && ! command -v tofu >/dev/null 2>&1; then
            curl -fsSL -o /tmp/terraform.zip \
              "https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip"
            sudo unzip -o /tmp/terraform.zip -d /usr/local/bin terraform
          fi
          # micromamba: single static binary, the lightest real conda client.
          curl -fsSL "https://micro.mamba.pm/api/micromamba/linux-64/latest" \
            | sudo tar -xj -C /usr/local bin/micromamba

      - name: Enable and check isolated receiver namespaces
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces by default.
          # This setting only affects this disposable runner; receivers still
          # run with isolated network/PID namespaces and a high-side-only bridge.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --net --pid --fork --kill-child=KILL --mount-proc ip link set lo up
          # Use hardware acceleration for the disconnected Snap VM if present.
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi

      - name: Cache verified Snap VM base image
        uses: actions/cache@v4
        with:
          path: ~/.cache/artigate-e2e/vm/noble-20260911-amd64.img
          key: snap-vm-amd64-612b2c0cc1bc413a

      - name: Install pinned Ollama and VSCodium clients
        run: |
          receiver_tools="${RUNNER_TEMP}/receiver-clients"
          mkdir -p "$receiver_tools/ollama" "$receiver_tools/vscodium"
          curl -fsSL --retry 3 \
            https://github.com/ollama/ollama/releases/download/v0.34.1/ollama-linux-amd64.tar.zst \
            -o "$receiver_tools/ollama.tar.zst"
          printf '%s  %s\n' \
            f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034 \
            "$receiver_tools/ollama.tar.zst" | sha256sum -c -
          # CPU inference keeps the release's bin/../lib layout. GPU runtimes
          # are unnecessary on this runner and consume several extra GB.
          tar --zstd -xf "$receiver_tools/ollama.tar.zst" -C "$receiver_tools/ollama" \
            --exclude='lib/ollama/cuda_*' --exclude='lib/ollama/vulkan'
          curl -fsSL --retry 3 \
            https://github.com/VSCodium/vscodium/releases/download/1.135.06055/VSCodium-linux-x64-1.135.06055.tar.gz \
            -o "$receiver_tools/vscodium.tar.gz"
          printf '%s  %s\n' \
            c09d8ac8dd7f52b09ee159ee24b440541dfd8f937a0f6f88cc428c78e48ee1f2 \
            "$receiver_tools/vscodium.tar.gz" | sha256sum -c -
          tar -xzf "$receiver_tools/vscodium.tar.gz" -C "$receiver_tools/vscodium"
          printf '%s\n' "$receiver_tools/ollama/bin" "$receiver_tools/vscodium/bin" >> "$GITHUB_PATH"
          rm "$receiver_tools/ollama.tar.zst" "$receiver_tools/vscodium.tar.gz"

      - name: Install pinned OCI clients
        run: |
          oci_tools_dir="${RUNNER_TEMP}/oci-clients"
          mkdir -p "$oci_tools_dir"
          # Release assets and SHA-256 digests from the corresponding official
          # oras-project/oras and sigstore/cosign GitHub releases.
          curl -fsSL --retry 3 \
            https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
            -o "$oci_tools_dir/oras.tar.gz"
          printf '%s  %s\n' \
            f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454 \
            "$oci_tools_dir/oras.tar.gz" | sha256sum -c -
          tar -xzf "$oci_tools_dir/oras.tar.gz" -C "$oci_tools_dir" oras
          sudo install -m 0755 "$oci_tools_dir/oras" /usr/local/bin/oras
          curl -fsSL --retry 3 \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            -o "$oci_tools_dir/cosign"
          printf '%s  %s\n' \
            4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 \
            "$oci_tools_dir/cosign" | sha256sum -c -
          sudo install -m 0755 "$oci_tools_dir/cosign" /usr/local/bin/cosign

      - name: Build pinned OCI Distribution conformance suite
        run: |
          # distribution-spec v1.1.1. Its standalone module stays outside
          # ArtiGate's dependency graph; pin the source commit as well as release.
          oci_conformance_src="${RUNNER_TEMP}/oci-distribution-spec"
          git init "$oci_conformance_src"
          git -C "$oci_conformance_src" fetch --depth 1 \
            https://github.com/opencontainers/distribution-spec.git \
            a139cc423184af6078077b9b7ee336eddbd03f8f
          git -C "$oci_conformance_src" checkout --detach FETCH_HEAD
          go -C "$oci_conformance_src/conformance" test -c \
            -ldflags '-X github.com/opencontainers/distribution-spec/conformance.Version=v1.1.1' \
            -o "${RUNNER_TEMP}/oci-clients/oci-distribution-conformance"
          sudo install -m 0755 "${RUNNER_TEMP}/oci-clients/oci-distribution-conformance" /usr/local/bin/oci-distribution-conformance

      - name: Preflight tool and upstream checks
        run: |
          set -x
          go version
          python3 --version
          node --version && npm --version
          mvn --version | head -1
          java -version 2>&1 | head -1
          docker info --format 'docker {{.ServerVersion}}'
          oras version
          cosign version
          dnf --version | head -1
          rpm --version
          curl --version | head -1
          hf version || huggingface-cli version
          cargo --version
          (terraform -version || tofu -version) | head -1
          helm version --short
          dotnet --version
          ruby --version && bundle --version
          php --version | head -1 && composer --version
          ansible-galaxy --version | head -1
          Rscript --version
          micromamba --version
          ollama --version
          codium --version
          qemu-system-x86_64 --version | head -1
          xorriso -version
          git --version
          # Availability preflight. ck retries transient upstream errors so a
          # brief outage does not fail the whole suite: curl --retry covers
          # timeouts, 429, and 5xx (e.g. an intermittent huggingface.co 504),
          # and the shell loop re-runs the transport-level failures --retry
          # never covers, like a TLS-handshake "connection reset by peer"
          # (exit 35/56). A real 404 (rotted reference) still fails fast:
          # with -f it surfaces as curl exit 22, which is never retried.
          ck() {
            local rc i
            for i in 1 2 3 4 5; do
              if curl -fsS --retry 5 --retry-delay 3 --retry-max-time 180 --connect-timeout 15 "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$rc" -eq 22 ]; then
                return "$rc"
              fi
              sleep 3
            done
            return "$rc"
          }
          # Fail fast if the suite's default GGUF reference has rotted
          # upstream (keep in sync with defaultGGUF in e2e/hf_test.go).
          ck -I -o /dev/null "https://huggingface.co/v2/bartowski/SmolLM2-135M-Instruct-GGUF/manifests/Q4_K_M"
          # ...and that the new streams' upstreams answer at all (keep in
          # sync with the pins in e2e/{crates,terraform,helm,nuget,apk}_test.go).
          ck -o /dev/null "https://index.crates.io/config.json"
          ck -o /dev/null "https://registry.terraform.io/.well-known/terraform.json"
          ck -I -o /dev/null "https://charts.jetstack.io/index.yaml"
          ck -o /dev/null "https://api.nuget.org/v3/index.json"
          ck -I -o /dev/null "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/x86_64/APKINDEX.tar.gz"
          # ...and the second wave's upstreams (keep in sync with the pins in
          # e2e/{conda,rubygems,composer,vsx,galaxy,cran,snap,git}_test.go).
          ck -I -o /dev/null "https://conda.anaconda.org/conda-forge/noarch/repodata.json"
          ck -L -o /dev/null "https://rubygems.org/info/rake"
          ck -o /dev/null "https://repo.packagist.org/p2/psr/container.json"
          ck -o /dev/null "https://open-vsx.org/api/usernamehw/errorlens"
          ck -L -o /dev/null "https://galaxy.ansible.com/api/"
          ck -I -o /dev/null "https://cloud.r-project.org/src/contrib/PACKAGES.gz"
          ck -o /dev/null -H "Snap-Device-Series: 16" "https://api.snapcraft.io/v2/snaps/info/hello"
          ck -o /dev/null "https://github.com/octocat/Hello-World.git/info/refs?service=git-upload-pack"

      - name: Test required-flow coverage gate
        run: python3 -B -m unittest discover -s e2e -p check_report_test.py -v

      - name: Run required end-to-end suite with race detector
        env:
          ARTIGATE_E2E_REQUIRE_ALL: "1"
          ARTIGATE_E2E_WORKDIR: ${{ runner.temp }}/artigate-e2e
          # Optional: a Hugging Face access token (read scope) authenticates
          # the HF collects. Anonymous LFS downloads from shared runner IPs
          # get intermittently rate-limited (HTTP 403 on public models),
          # which flakes TestHFRepo/TestHFGGUF; the harness passes this
          # through to the low server, and an unset secret keeps today's
          # anonymous behavior.
          ARTIGATE_HF_TOKEN: ${{ secrets.ARTIGATE_HF_TOKEN }}
        run: |
          set -o pipefail
          go test -tags e2e -json -race -count=1 -timeout 45m ./e2e \
            | tee "${RUNNER_TEMP}/artigate-e2e-results.jsonl"

      - name: Require every flow and reject all skips
        if: always()
        run: |
          python3 e2e/check_report.py \
            --input "${RUNNER_TEMP}/artigate-e2e-results.jsonl" \
            --report "${RUNNER_TEMP}/artigate-e2e-coverage.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload required-flow coverage and test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-required-flow-coverage
          path: |
            ${{ runner.temp }}/artigate-e2e-results.jsonl
            ${{ runner.temp }}/artigate-e2e-coverage.json
          if-no-files-found: error

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: ${{ runner.temp }}/artigate-e2e/*.log
          if-no-files-found: ignore

      - name: Upload OCI conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-distribution-conformance-v1.1.1
          path: ${{ runner.temp }}/artigate-e2e/oci-conformance/**
          if-no-files-found: ignore
